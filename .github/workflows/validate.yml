name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse (PowerShell 7)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [void][scriptblock]::Create((Get-Content -Raw ./scripts/install-gh.ps1))
          Write-Host 'Sintaxis OK (pwsh)'

      - name: No BOM (irm | iex)
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes('./scripts/install-gh.ps1')
          if ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw 'install-gh.ps1 no debe tener BOM: rompe irm | iex y [scriptblock]::Create'
          }
          Write-Host 'Sin BOM OK'

      - name: Check (PowerShell 7)
        shell: pwsh
        run: |
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP 'dsh-pwsh'
          ./scripts/install-gh.ps1 -Check

      - name: Parse like irm (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP 'dsh-irm'
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path .\scripts\install-gh.ps1))
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          $sb = [scriptblock]::Create($text)
          & $sb -Check
          Write-Host 'Parse irm OK'

      - name: Install (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = Join-Path $env:RUNNER_TEMP 'gh51'
          $dsh = Join-Path $env:RUNNER_TEMP 'dsh51'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\install-gh.ps1 -InstallDir $dst -DshHome $dsh -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { throw "5.1 install failed with code $LASTEXITCODE" }
          Write-Host '5.1 install OK'

      - name: Accents written by 5.1 (PowerShell 7)
        shell: pwsh
        run: |
          $dsh = Join-Path $env:RUNNER_TEMP 'dsh51'
          $raw = Get-Content -Raw (Join-Path $dsh 'AGENTS.md')
          if ($raw -notmatch 'Sesión') { throw 'Missing Sesion accent in AGENTS.md' }
          if ($raw -notmatch 'configuración') { throw 'Missing configuracion accent in AGENTS.md' }
          Write-Host 'Accents OK'

      - name: Reinstall protection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = Join-Path $env:RUNNER_TEMP 'gh51'
          $dsh = Join-Path $env:RUNNER_TEMP 'dsh51'
          $noop = powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\install-gh.ps1 -InstallDir $dst -DshHome $dsh -NoPathUpdate 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "No-op run failed with code $LASTEXITCODE" }
          if ($noop -notmatch 'sin cambios en el binario') { throw 'Same-version run is not a no-op' }
          $before = (Get-FileHash (Join-Path $dst 'gh.exe')).Hash
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\install-gh.ps1 -InstallDir $dst -DshHome $dsh -NoPathUpdate -Version 2.101.0
          if ($LASTEXITCODE -ne 2) { throw "Expected exit 2, got $LASTEXITCODE" }
          if ((Get-FileHash (Join-Path $dst 'gh.exe')).Hash -ne $before) { throw 'Binary changed without -Force' }
          $check = powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\install-gh.ps1 -Check -Version 2.101.0 -InstallDir $dst -DshHome $dsh 2>&1 | Out-String
          if ($check -notmatch 'requiere -Force') { throw 'Check does not predict the -Force requirement' }
          Write-Host 'Reinstall protection OK'

      - name: Other installation on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $other = Join-Path $env:RUNNER_TEMP 'othergh'
          New-Item -ItemType Directory -Path $other -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $other 'gh.cmd') -Value '@echo gh version 9.9.9 (2026-01-01)' -Encoding ascii
          $home2 = Join-Path $env:RUNNER_TEMP 'fakehome'
          New-Item -ItemType Directory -Path $home2 -Force | Out-Null
          $env:USERPROFILE = $home2
          $env:PATH = "$other;$env:PATH"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\install-gh.ps1 -DshHome (Join-Path $home2 '.dsh') -NoPathUpdate
          if ($LASTEXITCODE -ne 2) { throw "Expected exit 2 for other installation, got $LASTEXITCODE" }
          if (Test-Path (Join-Path $home2 '.local\bin\gh.exe')) { throw 'Installed a duplicate without -Force' }
          Write-Host 'Other installation blocked OK'

      - name: Repair broken binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = Join-Path $env:RUNNER_TEMP 'ghbad'
          New-Item -ItemType Directory -Path $bad -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $bad 'gh.exe') -Value 'broken' -Encoding ascii
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\install-gh.ps1 -InstallDir $bad -DshHome (Join-Path $env:RUNNER_TEMP 'dshbad') -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { throw "Repair failed with code $LASTEXITCODE" }
          $version = & (Join-Path $bad 'gh.exe') --version | Select-Object -First 1
          if ($version -notmatch '2\.102') { throw "Repair did not restore gh: $version" }
          Write-Host 'Repair OK'

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis
        run: bash -n scripts/install-gh.sh

      - name: shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning scripts/install-gh.sh
          else
            echo 'shellcheck no disponible en el runner'
          fi

      - name: Instalar, verificar e idempotencia
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          bash scripts/install-gh.sh --install-dir "$RUNNER_TEMP/bin" --dsh-home "$HOME/.dsh" --no-path-update
          test -x "$RUNNER_TEMP/bin/gh"
          assert_gh() { v=$("$RUNNER_TEMP/bin/gh" --version | head -n 1); case "$v" in *2.102.0*) ;; *) echo "$v"; exit 1 ;; esac; }
          assert_gh
          grep -q 'Sesión' "$HOME/.dsh/AGENTS.md"
          grep -q 'configuración' "$HOME/.dsh/AGENTS.md"
          second=$(bash scripts/install-gh.sh --install-dir "$RUNNER_TEMP/bin" --dsh-home "$HOME/.dsh" --no-path-update)
          case "$second" in
            *"ya instalado"*) ;;
            *) echo "$second"; echo 'La segunda ejecucion no fue idempotente'; exit 1 ;;
          esac

          set +e
          bash scripts/install-gh.sh --install-dir "$RUNNER_TEMP/bin" --dsh-home "$HOME/.dsh" --no-path-update --version 2.101.0 > "$RUNNER_TEMP/block.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then cat "$RUNNER_TEMP/block.log"; echo "Esperaba 2, obtuve $code"; exit 1; fi
          grep -q 'downgrade' "$RUNNER_TEMP/block.log"
          assert_gh
          check_out=$(bash scripts/install-gh.sh --check --install-dir "$RUNNER_TEMP/bin" --dsh-home "$HOME/.dsh" --version 2.101.0)
          case "$check_out" in
            *"requiere --force"*) ;;
            *) echo "$check_out"; echo 'Check no predice --force'; exit 1 ;;
          esac

          mkdir -p "$RUNNER_TEMP/other"
          printf '#!/bin/sh\necho "gh version 9.9.9"\n' > "$RUNNER_TEMP/other/gh"
          chmod +x "$RUNNER_TEMP/other/gh"
          set +e
          HOME="$RUNNER_TEMP/home2" PATH="$RUNNER_TEMP/other:$PATH" bash scripts/install-gh.sh --no-path-update > "$RUNNER_TEMP/other.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then cat "$RUNNER_TEMP/other.log"; echo "Esperaba 2, obtuve $code"; exit 1; fi
          test ! -e "$RUNNER_TEMP/home2/.local/bin/gh"

          printf 'broken' > "$RUNNER_TEMP/bin/gh"
          bash scripts/install-gh.sh --install-dir "$RUNNER_TEMP/bin" --dsh-home "$HOME/.dsh" --no-path-update > "$RUNNER_TEMP/repair.log" 2>&1
          grep -q 'repara' "$RUNNER_TEMP/repair.log"
          assert_gh

          bash scripts/install-gh.sh --check --install-dir "$RUNNER_TEMP/bin" --dsh-home "$HOME/.dsh"
          bash scripts/install-gh.sh --install-dir "$RUNNER_TEMP/bin" --dsh-home "$HOME/.dsh" --uninstall
          test ! -x "$RUNNER_TEMP/bin/gh"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis
        run: bash -n scripts/install-gh.sh

      - name: Instalar y verificar
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          bash scripts/install-gh.sh --install-dir "$RUNNER_TEMP/bin" --dsh-home "$HOME/.dsh" --no-path-update
          test -x "$RUNNER_TEMP/bin/gh"
          assert_gh() { v=$("$RUNNER_TEMP/bin/gh" --version | head -n 1); case "$v" in *2.102.0*) ;; *) echo "$v"; exit 1 ;; esac; }
          assert_gh
          grep -q 'Sesión' "$HOME/.dsh/AGENTS.md"
          set +e
          bash scripts/install-gh.sh --install-dir "$RUNNER_TEMP/bin" --dsh-home "$HOME/.dsh" --no-path-update --version 2.101.0 > "$RUNNER_TEMP/block.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then cat "$RUNNER_TEMP/block.log"; echo "Esperaba 2, obtuve $code"; exit 1; fi
          assert_gh

  block-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: El bloque de AGENTS.md es identico en ambos scripts
        run: |
          python3 - <<'PY'
          import difflib
          import re
          import sys

          pattern = re.compile(
              r'<!-- dsh-github-cli:begin \(bloque gestionado.*?<!-- dsh-github-cli:end -->',
              re.S,
          )

          def block(path):
              text = open(path, encoding='utf-8-sig').read().replace('\r\n', '\n')
              match = pattern.search(text)
              if not match:
                  sys.exit(f'No se encontro el bloque gestionado en {path}')
              return match.group(0)

          a = block('scripts/install-gh.ps1')
          b = block('scripts/install-gh.sh')
          if a != b:
              diff = difflib.unified_diff(
                  a.splitlines(), b.splitlines(), 'install-gh.ps1', 'install-gh.sh', lineterm=''
              )
              print('\n'.join(diff))
              sys.exit('El bloque de AGENTS.md difiere entre los dos instaladores')
          print('Bloque identico en los dos instaladores')
          PY
